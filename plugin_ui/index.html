  @import "./css/base.css";

<main>
  <div class="title-section">
    <strong class="title">Remap Variables</strong>
    <p>Remap variables to a new library inside the variables table.</p>
  </div>

  <form class="form">
    <div class="box box-border">
      <label for="selectLibrary" class="title">Target:</label>

      <select name="libraryName" id="selectLibrary" required>
        <option value="">--Choose a library--</option>
      </select>
    </div>

    <div class="box box-border">
      <p class="title">Scope</p>
      <!-- <div>
        <input
          type="radio"
          name="importType"
          id="byVariable"
          value="byVariable"
        />
        <label for="byVariable">Remap by single variable</label>
      </div>

      <div>
        <input
          type="radio"
          name="importType"
          id="byCollection"
          value="byCollection"
        />
        <label for="byCollection">Remap by single collection</label>
      </div>

      <div>
        <input
          type="radio"
          id="allCollections"
          name="importType"
          value="allCollections"
          checked
        />
        <label for="allCollections">Remap by all collections</label>
      </div> -->

      <label class="container"
        >Remap by single variable
        <input
          type="radio"
          name="importType"
          id="byVariable"
          value="byVariable"
        />
        <span class="checkmark"></span>
      </label>

      <label class="container"
        >Remap by single collection
        <input
          type="radio"
          name="importType"
          id="byCollection"
          value="byCollection"
        />
        <span class="checkmark"></span>
      </label>

      <label class="container"
        >Remap by all collections
        <input
          type="radio"
          name="importType"
          id="allCollections"
          value="allCollections"
          checked
        />
        <span class="checkmark"></span>
      </label>

      <div class="box" id="single-selection-box">
        <p class="title">Single selection</p>
        <div class="row" id="selectRow"></div>
      </div>
    </div>

    <div id="loadingItem" class="hidden">Loading...</div>
    <div id="message" class="hidden"></div>

    <div class="box">
      <button type="button" id="loadLibraries">Load Enabled Libraries</button>
      <button type="submit" id="submitButton" disabled>Remap Variables</button>
    </div>
  </form>
</main>
