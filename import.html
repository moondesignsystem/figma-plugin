<link
  rel="stylesheet"
  href="https://cdn.jsdelivr.net/gh/thomas-lowry/figma-plugin-ds/dist/figma-plugin-ds.css"
/>

<style>
  :root {
    --spacing: 0.8rem;
  }

  * {
    box-sizing: border-box;
  }

  body {
    background-color: var(--figma-color-bg);
    color: var(--figma-color-text);
    margin: 0;
    padding: var(--spacing);
  }

  html,
  body,
  main {
    height: 100%;
  }

  main {
    display: flex;
    flex-direction: column;
    gap: var(--spacing);
  }

  button {
    appearance: none;
    border-radius: 4px;
    padding: var(--spacing);
  }

  button,
  textarea {
    display: block;
    width: 100%;
  }

  button {
    background-color: var(--figma-color-bg-brand);
    border: none;
    color: var(--figma-color-text-onbrand);
    font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI",
      Roboto, Oxygen, Ubuntu, Cantarell, "Open Sans", "Helvetica Neue",
      sans-serif;
    font-weight: bold;
    cursor: pointer;
  }

  .row {
    display: flex;
    gap: var(--spacing);
    margin: var(--spacing);
  }
</style>
<main>
  <form>
    <div class="row">
      <label for="selectLibrary">Select Library:</label>

      <select name="libraryName" id="selectLibrary" required>
        <option value="">--Choose a library--</option>
      </select>
    </div>

    <div class="row">
      <div>
        <input
          type="radio"
          name="importType"
          id="byVariable"
          value="byVariable"
        />
        <label for="byVariable">By variable</label>
      </div>

      <div>
        <input
          type="radio"
          name="importType"
          id="byCollection"
          value="byCollection"
        />
        <label for="byCollection">By collection</label>
      </div>

      <div>
        <input
          type="radio"
          id="allCollections"
          name="importType"
          value="allCollections"
          checked
        />
        <label for="allCollections">All collections</label>
      </div>
    </div>

    <div class="row" id="selectRow"></div>

    <div class="row">
      <button type="button" id="loadLibraries">Load Enabled Libraries</button>
      <button type="submit">Import Variables</button>
    </div>
  </form>
</main>
<script>
  let localCollections = [];
  const form = document.querySelector("form");
  form.addEventListener("submit", (e) => {
    e.preventDefault();
    const formData = new FormData(form);
    const obj = Object.fromEntries(formData);
    parent.postMessage({ pluginMessage: { body: obj, type: "IMPORT" } }, "*");
  });

  document.getElementById("loadLibraries").addEventListener("click", () => {
    parent.postMessage({ pluginMessage: { type: "LOAD_LIBRARIES" } }, "*");
  });

  document.getElementById("byVariable").addEventListener("change", (event) => {
    const importType = event.target.checked;

    createCollectionsSelect(localCollections);
    createVariablesSelect();
  });

  document
    .getElementById("byCollection")
    .addEventListener("change", (event) => {
      const importType = event.target.checked;

      const selectRow = document.getElementById("selectRow");

      createCollectionsSelect(localCollections);
      removeNode("selectVariable");
    });

  document
    .getElementById("allCollections")
    .addEventListener("change", (event) => {
      const importType = event.target.checked;

      const selectRow = document.getElementById("selectRow");

      removeNode("selectCollection");
      removeNode("selectVariable");
    });

  window.onmessage = ({ data: { pluginMessage } }) => {
    if (pluginMessage.type === "LIBRARIES") {
      const { libraryNames, localVariableCollections } = pluginMessage;
      localCollections = localVariableCollections;

      populateLibrarySelect(libraryNames);
      populateCollectionsSelect(localCollections);
    }

    if (pluginMessage.type === "COLLECTION_VARIABLES") {
      const { collectionVariables } = pluginMessage;

      populateVariablesSelect(collectionVariables);
    }
  };

  const populateLibrarySelect = (libraryNames) => {
    const select = document.getElementById("selectLibrary");
    select.innerHTML = "";
    const emptyOption = document.createElement("option");
    emptyOption.value = "";
    emptyOption.textContent = "--Choose a library--";
    select.appendChild(emptyOption);
    libraryNames.forEach((name) => {
      const option = document.createElement("option");
      option.value = name;
      option.textContent = name;
      select.appendChild(option);
    });
  };

  const populateCollectionsSelect = (collections) => {
    const select = document.getElementById("selectCollection");

    if (!select) {
      return;
    }

    select.innerHTML = "";
    const emptyOption = document.createElement("option");
    emptyOption.value = "";
    emptyOption.textContent = "--Choose a collection--";
    select.appendChild(emptyOption);
    collections.forEach((collection) => {
      const { name, id } = collection;
      const option = document.createElement("option");
      option.value = id;
      option.textContent = name;
      select.appendChild(option);
    });
  };

  const populateVariablesSelect = (variables) => {
    const select = document.getElementById("selectVariable");

    if (!select) {
      return;
    }

    select.innerHTML = "";
    const emptyOption = document.createElement("option");
    emptyOption.value = "";
    emptyOption.textContent = "--Choose a variable--";
    select.appendChild(emptyOption);
    variables.forEach((variable) => {
      const { name, id } = variable;
      const option = document.createElement("option");
      option.value = id;
      option.textContent = name;
      select.appendChild(option);
    });
  };

  const createCollectionsSelect = (collections) => {
    const selectCollections = document.getElementById("selectCollection");

    if (selectCollections) {
      return;
    }

    const selectRow = document.getElementById("selectRow");

    const select = document.createElement("select");
    select.name = "collectionId";
    select.id = "selectCollection";
    select.required = true;
    selectRow.appendChild(select);

    populateCollectionsSelect(collections);
    addCollectionsSelectEventListener();
  };

  const createVariablesSelect = (variables) => {
    const variableSelect = document.getElementById("selectVariable");

    if (variableSelect) {
      return;
    }

    const selectRow = document.getElementById("selectRow");

    const select = document.createElement("select");
    select.name = "variableId";
    select.id = "selectVariable";
    select.required = true;
    const emptyOption = document.createElement("option");
    emptyOption.value = "";
    emptyOption.textContent = "--Choose a variable--";
    select.appendChild(emptyOption);
    selectRow.appendChild(select);
  };

  const removeNode = (nodeId) => {
    const node = document.getElementById(nodeId);

    if (!node) {
      return;
    }

    node.remove();
  };

  const addCollectionsSelectEventListener = () => {
    document
      .querySelector("#selectCollection")
      .addEventListener("change", (event) => {
        const collectionId = event.target.value;
        parent.postMessage(
          {
            pluginMessage: {
              type: "LOAD_LOCAL_COLLECTION_VARIABLES",
              body: { collectionId },
            },
          },
          "*"
        );
      });
  };
</script>
